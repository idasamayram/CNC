name: Build PPTX

on:
  push:
    branches: [ "presentation" ]
    paths-ignore:
      - 'thesis_presentation.pptx'
  pull_request:
    branches: [ "presentation" ]
    paths-ignore:
      - 'thesis_presentation.pptx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build PPTX
        run: |
          pandoc slides.md -t pptx -o thesis_presentation.pptx

      - name: Commit PPTX
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add thesis_presentation.pptx || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add/update thesis_presentation.pptx [skip ci]"
            git push
          fi